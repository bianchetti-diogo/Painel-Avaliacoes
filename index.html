<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Avaliações Comportamentais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0E1015; --bg-2:#151822; --card:#171A24; --card-2:#1D2130;
    --ink:#F3F2ED; --ink-soft:#9A9CAA; --ink-faint:#6B6D7A;
    --line: rgba(243,242,237,0.10); --line-strong: rgba(243,242,237,0.22);
    --D:#F03A47; --I:#F5A623; --S:#1FBF9F; --C:#4C6FFF;
    --accent-most:#1FE0D0; --accent-least:#FF3D7F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(76,111,255,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(240,58,71,0.08), transparent 40%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-soft); display:flex; align-items:center; gap:10px;
  }
  .screen{ display:none; }
  .screen.active{ display:block; }
  .btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px; border:none; cursor:pointer;
    padding:12px 22px; border-radius:3px; transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--ink); color:var(--bg); }
  .btn-primary:hover{ box-shadow:0 0 18px rgba(31,224,208,0.22); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--line-strong); }
  .f-input{
    width:100%; padding:12px 13px; border:1px solid var(--line); background:var(--card);
    border-radius:3px; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
  }
  .f-input:focus{ outline:2px solid var(--accent-most); outline-offset:1px; }
  .f-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); display:block; margin-bottom:6px; }

  /* ---------- LOGIN ---------- */
  #screen-login .box{ max-width:360px; margin:100px auto 0; text-align:center; }
  #screen-login h1{ font-size:24px; margin:16px 0 8px; }
  #screen-login .field{ margin-top:16px; text-align:left; }
  #login-error{ color:var(--accent-least); font-size:13px; margin-top:10px; min-height:16px; }

  /* ---------- APP SHELL ---------- */
  #screen-app{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
    padding:26px 16px; display:flex; flex-direction:column;
  }
  .sidebar h2{ font-size:15px; padding:0 10px; margin-bottom:18px; }
  .menu-item{
    padding:11px 12px; border-radius:3px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; margin-bottom:4px; display:flex; align-items:center; gap:9px;
  }
  .menu-item:hover{ background:var(--card-2); color:var(--ink); }
  .menu-item.active{ background:var(--card-2); color:var(--ink); }
  .menu-item i{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .sidebar-footer{ margin-top:auto; padding:0 10px; }
  .sidebar-footer .btn{ width:100%; }

  .main{ flex:1; padding:34px 40px; max-width:920px; }

  /* ---------- LIST ---------- */
  .list-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .sub-count{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faint); }
  .sub-card{
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:16px 18px;
    margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:border-color .15s ease;
  }
  .sub-card:hover{ border-color:var(--line-strong); }
  .sub-card .name{ font-weight:700; font-size:14.5px; }
  .sub-card .meta{ font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .sub-card .badge{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:700; padding:4px 10px;
    border-radius:20px; color:#03181A;
  }

  /* ---------- DETAIL (relatório) ---------- */
  .res-hero{ text-align:center; padding:32px 24px 28px; background:var(--card); border:1px solid var(--line); border-radius:3px; margin-bottom:26px; }
  .res-combo{ font-family:'Fraunces',serif; font-size:44px; font-weight:700; margin:10px 0 2px; }
  .res-pct-row{ display:flex; justify-content:center; gap:20px; margin-top:18px; flex-wrap:wrap; }
  .res-pct-item{ text-align:center; min-width:90px; }
  .res-pct-item .n{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; }
  .res-pct-item .name{ font-size:11px; font-weight:700; margin-top:4px; }
  .section-label{ display:flex; align-items:center; gap:10px; margin:32px 0 14px; }
  .section-label span{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap; }
  .section-label::after{ content:''; height:1px; flex:1; background:var(--line); }
  .bars{ display:flex; flex-direction:column; gap:12px; }
  .bar-row{ display:grid; grid-template-columns:140px 1fr 42px; align-items:center; gap:12px; }
  .bar-row .lbl{ font-size:13px; font-weight:600; }
  .bar-track{ height:13px; background:var(--card-2); border-radius:20px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:20px; }
  .bar-row .val{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; }
  .quad-wrap{ display:flex; justify-content:center; margin:16px 0; }
  .desc-block{ background:var(--card); border:1px solid var(--line); border-radius:3px; padding:20px 22px; font-size:14px; line-height:1.7; color:var(--ink-soft); }
  .swot-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .swot-card{ border:1px solid var(--line); border-radius:3px; padding:16px 18px; background:var(--card); }
  .swot-card h4{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .swot-card h4 i{ width:8px;height:8px;border-radius:50%;display:inline-block; }
  .swot-card ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.55; color:var(--ink-soft); }
  .rel-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .rel-card{ border:1px solid var(--line); border-radius:3px; padding:14px 16px; background:var(--card); }
  .rel-card h4{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .rel-card h4 i{ width:8px;height:8px;border-radius:50%;display:inline-block; }
  .rel-card p{ margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-soft); }
  .conflict-card{ margin-top:14px; border:1px solid rgba(255,61,127,0.35); border-radius:3px; padding:18px 20px; background:linear-gradient(135deg, rgba(255,61,127,0.08), rgba(76,111,255,0.05)); }
  .conflict-card h4{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin:0 0 10px; color:var(--accent-least); }
  .footer-actions{ display:flex; gap:10px; margin-top:32px; }
  .empty-note{ color:var(--ink-faint); font-size:13.5px; }

    #screen-app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:14px; }
    .sidebar h2{ display:none; }
    .sidebar-footer{ margin:0 0 0 auto; }
    .menu-item{ white-space:nowrap; }
    .main{ padding:20px; }
    .swot-grid, .rel-grid{ grid-template-columns:1fr; }
  }
</style>
</head>

</section>

/* ============================================================
   AUTENTICAÇÃO
   ============================================================ */
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  if(!supabaseClient){
    err.textContent = 'Conexão com o banco de dados não está configurada corretamente.';
    return;
  }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    err.textContent = 'Login inválido: ' + error.message;
    return;
  }
  enterApp();
}
async function doLogout(){
  await supabaseClient.auth.signOut();
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
}

async function checkExistingSession(){
  const { data } = await supabaseClient.auth.getSession();
  if(data && data.session){ enterApp(); }
}

function enterApp(){
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  renderMenu();
  if(ASSESSMENT_REGISTRY.length) selectAssessment(ASSESSMENT_REGISTRY[0].key);
}

document.getElementById('login-password').addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});

/* ============================================================
   MENU E LISTA
   ============================================================ */
let CURRENT_TYPE = null;
let CURRENT_SUBMISSIONS = [];

function renderMenu(){
  const holder = document.getElementById('menu-holder');
  holder.innerHTML = ASSESSMENT_REGISTRY.map(a =>
    '<div class="menu-item" id="menu-'+a.key+'" onclick="selectAssessment(\''+a.key+'\')"><i style="background:'+a.color+'"></i>'+a.label+'</div>'
  ).join('');
}

async function selectAssessment(key){
  CURRENT_TYPE = key;
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  const menuEl = document.getElementById('menu-'+key);
  if(menuEl) menuEl.classList.add('active');
  document.getElementById('view-detail').style.display = 'none';
  document.getElementById('view-list').style.display = 'block';
  await loadSubmissions(key);
}

async function loadSubmissions(key){
  const listView = document.getElementById('view-list');
  const cfg = ASSESSMENT_REGISTRY.find(a => a.key === key);
  listView.innerHTML = '<div class="list-header"><h1 style="font-size:24px;">'+cfg.label+'</h1></div><p class="empty-note">Carregando...</p>';
  const { data, error } = await supabaseClient
    .from('submissions')
    .select('*')
    .eq('assessment_type', key)
    .order('created_at', { ascending: false });

  if(error){
    listView.innerHTML = '<div class="list-header"><h1 style="font-size:24px;">'+cfg.label+'</h1></div><p class="empty-note">Erro ao carregar: '+error.message+'</p>';
    return;
  }
  CURRENT_SUBMISSIONS = data || [];
  renderListView(cfg);
}

function renderListView(cfg){
  const listView = document.getElementById('view-list');
  const sys = SYSTEMS[cfg.system];
  let html = '<div class="list-header"><h1 style="font-size:24px;">'+cfg.label+'</h1><span class="sub-count">'+CURRENT_SUBMISSIONS.length+' avaliação(ões)</span></div>';
  if(CURRENT_SUBMISSIONS.length === 0){
    html += '<p class="empty-note">Nenhuma avaliação enviada ainda pra esse público.</p>';
  } else {
    html += CURRENT_SUBMISSIONS.map((row, idx) => {
      const date = row.created_at ? new Date(row.created_at).toLocaleString('pt-BR') : '';
      const domInfo = sys.letters[row.dominant];
      const secInfo = sys.letters[row.secondary];
      const color = domInfo ? domInfo.color : 'var(--ink)';
      return '<div class="sub-card" onclick="openDetail('+idx+')">'+
        '<div><div class="name">'+(row.name||'(sem nome)')+'</div>'+
        '<div class="meta">'+(row.role ? row.role+' · ' : '')+date+(row.event_label ? ' · '+row.event_label : '')+'</div></div>'+
        '<span class="badge" style="background:'+color+'">'+(domInfo?domInfo.name:row.dominant)+' / '+(secInfo?secInfo.name:row.secondary)+'</span>'+
      '</div>';
    }).join('');
  }
  listView.innerHTML = html;
}

/* ============================================================
   DETALHE — relatório completo
   ============================================================ */
let CURRENT_REPORT = null;

function openDetail(idx){
  const row = CURRENT_SUBMISSIONS[idx];
  const cfg = ASSESSMENT_REGISTRY.find(a => a.key === CURRENT_TYPE);
  const sys = SYSTEMS[cfg.system];
  CURRENT_REPORT = {
    name: row.name, role: row.role,
    dom: row.dominant, sec: row.secondary,
    pct: { D: row.pct_d, I: row.pct_i, S: row.pct_s, C: row.pct_c },
    sys: sys
  };
  document.getElementById('view-list').style.display = 'none';
  const detailView = document.getElementById('view-detail');
  detailView.style.display = 'block';
  detailView.innerHTML = buildDetailHTML(CURRENT_REPORT);
}

function buildDetailHTML(report){
  const sys = report.sys;
  const order = sys.order;
  const pct = report.pct, dom = report.dom, sec = report.sec;
  const domInfo = sys.letters[dom], secInfo = sys.letters[sec];

  let html = '<button class="btn btn-ghost" onclick="backToList()">← Voltar à lista</button>';

  html += '<div class="res-hero" style="margin-top:20px;">'+
    '<div class="eyebrow" style="justify-content:center;">'+(report.name||'')+(report.role?' · '+report.role:'')+'</div>'+
    '<div class="res-combo"><span style="color:'+domInfo.color+'">'+dom+'</span><span style="opacity:0.55;font-size:0.7em;color:'+secInfo.color+'">'+sec+'</span></div>'+
    '<div style="color:var(--ink-soft); font-size:15px;">'+domInfo.temperament+' / '+secInfo.temperament+'</div>'+
    '<div class="res-pct-row">'+
      order.map(l => '<div class="res-pct-item"><div class="n" style="color:'+sys.letters[l].color+'">'+Math.round(pct[l])+'%</div><div class="name" style="color:'+sys.letters[l].color+'">'+sys.letters[l].name.toUpperCase()+'</div></div>').join('') +
    '</div></div>';

  html += '<div class="section-label"><span>Distribuição do perfil</span></div><div class="bars">';
  order.forEach(l => {
    html += '<div class="bar-row"><div class="lbl">'+sys.letters[l].name+' ('+l+')</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct[l]+'%;background:'+sys.letters[l].color+'"></div></div>'+
      '<div class="val">'+Math.round(pct[l])+'%</div></div>';
  });
  html += '</div>';

  html += '<div class="section-label"><span>Mapa de posicionamento</span></div><div class="quad-wrap">'+buildQuadrantSVG(pct, sys)+'</div>';

  html += '<div class="section-label"><span>Leitura do perfil</span></div><div class="desc-block">'+
    '<p><b>'+(report.name||'Este perfil')+' combina predominância de '+domInfo.name+' ('+dom+' / '+domInfo.temperament+') com traço secundário de '+secInfo.name+' ('+sec+' / '+secInfo.temperament+').</b></p>'+
    '<p>Na maior parte do tempo, o comportamento tende a ser de pessoas '+domInfo.desc+'</p>'+
    '<p>Como traço de apoio, também aparecem características de pessoas '+secInfo.desc+'</p>'+
  '</div>';

  const mergeList = (key, domN, secN) => domInfo[key].slice(0,domN).concat(secInfo[key].slice(0,secN));
  const blocks = [
    {cls:'fo', title:'Forças', items: mergeList('s',3,2), color: sys.letters.S ? sys.letters.S.color : sys.letters[order[2]].color},
    {cls:'fr', title:'Fraquezas', items: mergeList('w',3,2), color: sys.letters.D ? sys.letters.D.color : sys.letters[order[0]].color},
    {cls:'op', title:'Oportunidades', items: mergeList('o',3,2), color: sys.letters.I ? sys.letters.I.color : sys.letters[order[1]].color},
    {cls:'am', title:'Ameaças', items: mergeList('t',3,2), color: sys.letters.C ? sys.letters.C.color : sys.letters[order[3]].color}
  ];
  html += '<div class="section-label"><span>Análise SWOT</span></div><div class="swot-grid">'+
    blocks.map(b => '<div class="swot-card"><h4><i style="background:'+b.color+'"></i>'+b.title+'</h4><ul>'+b.items.map(it=>'<li>'+it+'</li>').join('')+'</ul></div>').join('') +
  '</div>';

  const others = order.filter(l => l !== dom);
  html += '<div class="section-label"><span>Como se relacionar com outros perfis</span></div><div class="rel-grid">'+
    others.map(l => '<div class="rel-card"><h4><i style="background:'+sys.letters[l].color+'"></i>Com perfil '+l+' · '+sys.letters[l].name+'</h4><p>'+sys.relations[dom][l]+'</p></div>').join('') +
  '</div>';
  html += '<div class="conflict-card"><h4>⚡ Ponto de atenção — conflito com perfil oposto</h4><p>'+sys.conflict[dom]+'</p></div>';

  html += '<div class="footer-actions">'+
    '<button class="btn btn-primary" onclick="exportPDF()">↓ Baixar relatório em PDF</button>'+
    '<button class="btn btn-ghost" onclick="backToList()">← Voltar à lista</button>'+
  '</div>';

  return html;
}

function backToList(){
  document.getElementById('view-detail').style.display = 'none';
  document.getElementById('view-list').style.display = 'block';
}

function buildQuadrantSVG(pct, sys){
  const order = sys.order; // [D,I,S,C]
  const outgoing = pct[order[0]] + pct[order[1]];
  const reserved = pct[order[2]] + pct[order[3]];
  const peopleOriented = pct[order[1]] + pct[order[2]];
  const taskOriented = pct[order[0]] + pct[order[3]];
  const x = (peopleOriented - taskOriented) / 100;
  const yVal = (outgoing - reserved) / 100;
  const W=440,H=340, cx=W/2, cy=H/2, R=140;
  const px = cx + x*R, py = cy - yVal*R;
  const sortedKeys = order.slice().sort((a,b)=>pct[b]-pct[a]);
  const dotColor = sys.letters[sortedKeys[0]].color;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:440px">'+
    '<line x1="0" y1="'+cy+'" x2="'+W+'" y2="'+cy+'" stroke="rgba(243,242,237,0.14)"/>'+
    '<line x1="'+cx+'" y1="0" x2="'+cx+'" y2="'+H+'" stroke="rgba(243,242,237,0.14)"/>'+
    '<text x="12" y="18" font-family="IBM Plex Mono" font-size="9.5" fill="'+sys.letters[order[0]].color+'" font-weight="600">'+order[0]+' · RÁPIDO/TAREFA</text>'+
    '<text x="'+(W-12)+'" y="18" text-anchor="end" font-family="IBM Plex Mono" font-size="9.5" fill="'+sys.letters[order[1]].color+'" font-weight="600">'+order[1]+' · RÁPIDO/PESSOAS</text>'+
    '<text x="12" y="'+(H-8)+'" font-family="IBM Plex Mono" font-size="9.5" fill="'+sys.letters[order[3]].color+'" font-weight="600">'+order[3]+' · CAUTELOSO/TAREFA</text>'+
    '<text x="'+(W-12)+'" y="'+(H-8)+'" text-anchor="end" font-family="IBM Plex Mono" font-size="9.5" fill="'+sys.letters[order[2]].color+'" font-weight="600">'+order[2]+' · CAUTELOSO/PESSOAS</text>'+
    '<circle cx="'+px+'" cy="'+py+'" r="8" fill="'+dotColor+'" stroke="'+dotColor+'" stroke-opacity="0.35" stroke-width="7"/>'+
    '<circle cx="'+px+'" cy="'+py+'" r="8" fill="'+dotColor+'" stroke="#0E1015" stroke-width="2"/>'+
  '</svg>';
}

/* ============================================================
   PDF EXPORT
   ============================================================ */
function exportPDF(){
  if(!CURRENT_REPORT) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageW = 210, pageH = 297, margin = 20, maxW = pageW - margin*2;
  let y = margin;
  const report = CURRENT_REPORT;
  const sys = report.sys;
  const pct = report.pct, dom = report.dom, sec = report.sec;
  const domInfo = sys.letters[dom], secInfo = sys.letters[sec];
  const today = new Date().toLocaleDateString('pt-BR');

  function checkPage(needed){ if(y + needed > pageH - margin){ doc.addPage(); y = margin; } }
  function addWrapped(text, x, w, size, color, lineH, bold){
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.setFontSize(size);
    doc.setTextColor(color[0],color[1],color[2]);
    const lines = doc.splitTextToSize(text, w);
    checkPage(lines.length * lineH);
    const prevFactor = doc.getLineHeightFactor();
    doc.setLineHeightFactor(lineH / (size * 25.4/72));
    doc.text(lines, x, y, lines.length > 1 ? {align:'justify', maxWidth:w} : {});
    doc.setLineHeightFactor(prevFactor);
    y += lines.length * lineH;
  }
  function hexToRgb(hex){
    const v = hex.replace('#','');
    return [parseInt(v.substr(0,2),16), parseInt(v.substr(2,2),16), parseInt(v.substr(4,2),16)];
  }
  function tri(p1,p2,p3, hex){
    const c = hexToRgb(hex);
    doc.setFillColor(c[0],c[1],c[2]);
    doc.triangle(p1[0],p1[1],p2[0],p2[1],p3[0],p3[1],'F');
  }

  doc.setFillColor(14,16,21);
  doc.rect(0,0,pageW,32,'F');
  const lx = margin, ly = 7, ls = 17;
  const cxL = lx+ls/2, cyL = ly+ls/2, rL = ls/2;
  tri([cxL-rL,cyL],[cxL,cyL-rL],[cxL,cyL], '#F03A47');
  tri([cxL,cyL-rL],[cxL+rL,cyL],[cxL,cyL], '#F5A623');
  tri([cxL+rL,cyL],[cxL,cyL+rL],[cxL,cyL], '#1FBF9F');
  tri([cxL,cyL+rL],[cxL-rL,cyL],[cxL,cyL], '#4C6FFF');
  doc.setTextColor(243,242,237);
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Mapa Comportamental — DISC & Temperamentos', lx+ls+6, 14);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Relatório gerado em ' + today, lx+ls+6, 21);
  y = 42;

  if(report.name){ addWrapped('Nome: ' + report.name, margin, maxW, 12, [30,30,35], 6, true); }
  if(report.role){ addWrapped('Cargo / função: ' + report.role, margin, maxW, 11, [90,90,98], 6, false); }
  y += 2;
  addWrapped('Perfil dominante: ' + domInfo.name + ' (' + dom + ') — ' + domInfo.temperament + '  ·  ' + Math.round(pct[dom]) + '%', margin, maxW, 13, hexToRgb(domInfo.color), 7, true);
  addWrapped('Perfil secundário: ' + secInfo.name + ' (' + sec + ') — ' + secInfo.temperament + '  ·  ' + Math.round(pct[sec]) + '%', margin, maxW, 12, hexToRgb(secInfo.color), 7, true);
  y += 4;

  checkPage(10);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,25);
  doc.text('Distribuição do perfil', margin, y); y += 7;
  sys.order.forEach(l => {
    checkPage(9);
    const barMaxW = maxW - 55;
    doc.setFontSize(9.5); doc.setFont('helvetica','normal'); doc.setTextColor(20,20,25);
    doc.text(sys.letters[l].name + ' (' + l + ' · ' + sys.letters[l].temperament + ')', margin, y+3.2);
    doc.setFillColor(230,230,232); doc.rect(margin+55, y, barMaxW, 4, 'F');
    const rgb = hexToRgb(sys.letters[l].color);
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(margin+55, y, barMaxW * (pct[l]/100), 4, 'F');
    doc.setFontSize(9); doc.text(Math.round(pct[l])+'%', margin+55+barMaxW+3, y+3.2);
    y += 9;
  });
  y += 4;

  checkPage(14);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,25);
  doc.text('Leitura do perfil', margin, y); y += 7;
  const who = report.name || 'Este perfil';
  addWrapped(who + ' combina predominância de ' + domInfo.name + ' (' + dom + ' / ' + domInfo.temperament + ') com traço secundário de ' + secInfo.name + ' (' + sec + ' / ' + secInfo.temperament + ').', margin, maxW, 10, [30,30,35], 5.4, false);
  y += 1;
  addWrapped('Na maior parte do tempo, o comportamento tende a ser de pessoas ' + domInfo.desc, margin, maxW, 10, [90,90,98], 5.4, false);
  y += 1;
  addWrapped('Como traço de apoio, também aparecem características de pessoas ' + secInfo.desc, margin, maxW, 10, [90,90,98], 5.4, false);
  y += 6;

  function section(title, items, color){
    checkPage(10);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(color[0],color[1],color[2]);
    doc.text(title, margin, y); y += 6.5;
    items.forEach(it => { addWrapped('•  ' + it, margin+2, maxW-2, 9.5, [90,90,98], 5.2, false); });
    y += 3;
  }
  const mergeList = (key, domN, secN) => domInfo[key].slice(0,domN).concat(secInfo[key].slice(0,secN));
  checkPage(20);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,20,25);
  doc.text('Análise SWOT', margin, y); y += 8;
  section('Forças', mergeList('s',3,2), hexToRgb(sys.letters.S.color));
  section('Fraquezas', mergeList('w',3,2), hexToRgb(sys.letters.D.color));
  section('Oportunidades', mergeList('o',3,2), hexToRgb(sys.letters.I.color));
  section('Ameaças', mergeList('t',3,2), hexToRgb(sys.letters.C.color));

  checkPage(20);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,20,25);
  doc.text('Como se relacionar com outros perfis', margin, y); y += 8;
  sys.order.filter(l => l !== dom).forEach(l => {
    checkPage(12);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    const rgb = hexToRgb(sys.letters[l].color);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text('Com perfil ' + l + ' · ' + sys.letters[l].name, margin, y); y += 5.5;
    addWrapped(sys.relations[dom][l], margin, maxW, 9.5, [90,90,98], 5.2, false);
    y += 3;
  });

  checkPage(16);
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(255,61,127);
  doc.text('Ponto de atenção — conflito com perfil oposto', margin, y); y += 6;
  addWrapped(sys.conflict[dom].replace(/<\/?b>/g,''), margin, maxW, 9.5, [90,90,98], 5.2, false);

  checkPage(14); y += 4;
  doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(140,140,148);
  addWrapped('Este relatório é uma ferramenta de autopercepção comportamental, não um laudo psicológico. Os resultados refletem tendências de comportamento no ambiente de trabalho e podem mudar conforme contexto e momento de vida.', margin, maxW, 8, [140,140,148], 4.4, false);

  const fname = 'relatorio' + (report.name ? ('-'+report.name.toLowerCase().replace(/\s+/g,'-')) : '') + '.pdf';
  doc.save(fname);
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
checkExistingSession();
</script>
